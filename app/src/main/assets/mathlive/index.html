<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="vendor/mathlive-static.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    font-family: system-ui, -apple-system, "Noto Sans SC", sans-serif;
    color: #e6e1e5;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    flex: 1;
    display: flex;
    align-items: center;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 2px 10px;
    box-sizing: border-box;
    scrollbar-width: none;
  }
  #wrap::-webkit-scrollbar { display: none; }
  math-field {
    flex: 0 0 auto;
    min-width: 100%;
    border: none;
    outline: none;
    padding: 0;
    background: transparent;
    font-size: 30px;
    line-height: 1.25;
    --caret-color: transparent;
    --selection-background-color: rgba(128, 120, 255, 0.25);
    --contains-highlight-background-color: transparent;
  }
  math-field::part(menu-toggle),
  math-field::part(virtual-keyboard-toggle) { display: none; }
  #empty {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    opacity: 0.38;
    pointer-events: none;
    transition: opacity .15s ease;
  }
  #empty.hide { opacity: 0; }
</style>
</head>
<body>
  <div id="wrap"><math-field id="mf" read-only></math-field></div>
  <div id="empty">输入公式…</div>
<script src="vendor/mathlive.min.js"></script>
<script>
(function () {
  var mf = document.getElementById('mf');
  var wrap = document.getElementById('wrap');
  var empty = document.getElementById('empty');
  var ready = false;
  var pending = null;

  mf.readOnly = true;
  try { mf.mathVirtualKeyboardPolicy = 'manual'; } catch (e) { /* 旧版本忽略 */ }

  function apply(latex, fontSize, color) {
    if (color) {
      document.body.style.color = color;
      mf.style.color = color;
    }
    if (fontSize) mf.style.fontSize = fontSize + 'px';
    try {
      mf.setValue(latex || '');
    } catch (e) {
      try { mf.value = latex || ''; } catch (e2) { /* ignore */ }
    }
    var hasContent = !!(latex && latex.length);
    if (empty) empty.classList.toggle('hide', hasContent);
    requestAnimationFrame(function () {
      wrap.scrollLeft = wrap.scrollWidth;
    });
  }

  window.deltaRender = function (latex, fontSize, color) {
    if (!ready) { pending = [latex, fontSize, color]; return; }
    apply(latex, fontSize, color);
  };

  function boot() {
    if (ready) return;
    ready = true;
    if (pending) { apply(pending[0], pending[1], pending[2]); pending = null; }
  }

  if (window.customElements && customElements.whenDefined) {
    customElements.whenDefined('math-field').then(function () { setTimeout(boot, 0); });
  }
  window.addEventListener('load', function () { setTimeout(boot, 60); });
  setTimeout(boot, 1200);
})();
</script>
</body>
</html>
