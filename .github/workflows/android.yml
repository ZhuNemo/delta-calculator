name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.workbuddy/**'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # MathLive 不打进仓库，构建前拉到 assets 里，保证 APK 离线可用
      - name: Fetch MathLive bundle
        run: node tools/fetch-mathlive.mjs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 先单独编译，编译错误的行会通过 ::error:: 变成 check-run annotation，
      # 这样即使拿不到完整日志也能定位到文件和行号
      - name: Compile Kotlin
        shell: bash
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin --stacktrace 2>&1 | tee compile.log

      - name: Report Kotlin errors
        if: failure()
        shell: bash
        run: |
          (grep -E "^e: " compile.log | head -30 || true) | while IFS= read -r line; do
            echo "::error title=Kotlin::$line"
          done

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          (grep -E "FAILED|AssertionError|expected:|Caused by:" test.log | head -30 || true) | while IFS= read -r line; do
            echo "::error title=Test::$line"
          done

      # 测试失败时把 HTML 报告带出来，省得再翻几千行日志
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-calculator-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: delta-calculator-debug
          path: apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
